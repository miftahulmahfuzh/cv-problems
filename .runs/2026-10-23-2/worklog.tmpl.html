<title>Drill Worklog 2026-10-23-2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #e9ecee;
    --panel: #f6f8f9;
    --mount: #ffffff;
    --ink: #14181d;
    --ink-soft: #5c6670;
    --ink-faint: #828d96;
    --rule: #ccd4da;
    --rule-firm: #aab6bf;
    --accent: #1b5e8c;
    --focus: #1b5e8c;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15191d;
      --panel: #1c2126;
      --mount: #eef1f3;
      --ink: #e4e9ec;
      --ink-soft: #97a3ad;
      --ink-faint: #76828c;
      --rule: #2c333a;
      --rule-firm: #3c454d;
      --accent: #6fb3dd;
      --focus: #6fb3dd;
    }
  }

  :root[data-theme="dark"] {
    --ground: #15191d;
    --panel: #1c2126;
    --mount: #eef1f3;
    --ink: #e4e9ec;
    --ink-soft: #97a3ad;
    --ink-faint: #76828c;
    --rule: #2c333a;
    --rule-firm: #3c454d;
    --accent: #6fb3dd;
    --focus: #6fb3dd;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 32px 72px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* ---- masthead ---- */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 20px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--rule-firm);
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .sub {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0;
    margin-left: auto;
  }

  .sub b { font-weight: 500; color: var(--ink); }

  /* ---- sections ---- */
  section {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 6px;
  }

  h2 {
    font-size: 0.74rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    margin: 0;
  }

  .sec-note {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-faint);
    margin: 0;
    margin-left: auto;
  }

  /* ---- plates ---- */
  .plate {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
  }

  .plate-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
  }

  .plate-name {
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink);
  }

  .plate-meta {
    font-family: var(--mono);
    font-size: 0.76rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }

  .mount {
    background: var(--mount);
    overflow: auto;
    padding: 10px;
  }

  .mount img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
  }

  .mount.actual img {
    width: auto;
    max-width: none;
  }

  .plate-foot {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 14px;
    border-top: 1px solid var(--rule);
  }

  .zoom {
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--accent);
    background: none;
    border: 1px solid var(--rule-firm);
    padding: 3px 9px;
    cursor: pointer;
  }

  .zoom:hover { border-color: var(--accent); }
  .zoom[aria-pressed="true"] {
    color: var(--mount);
    background: var(--accent);
    border-color: var(--accent);
  }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .weight {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }

  .caption {
    font-size: 0.86rem;
    color: var(--ink-soft);
    margin: 0;
    padding: 10px 14px;
    border-top: 1px solid var(--rule);
  }

  .empty {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--ink-faint);
    margin: 0;
    padding: 22px 16px;
    border: 1px dashed var(--rule-firm);
    text-align: center;
  }

  .empty code {
    font-family: var(--mono);
    color: var(--ink-soft);
  }

  .prose { font-size: 0.92rem; max-width: 68ch; margin: 0; }
  .prose p { margin: 0 0 10px; }
  blockquote.brief {
    margin: 0;
    padding: 14px 18px;
    background: var(--panel);
    border-left: 3px solid var(--accent);
  }
  blockquote.brief p { margin: 0 0 8px; }
  blockquote.brief p:last-child { margin: 0; }
  blockquote.brief code {
    font-family: var(--mono);
    font-size: 0.88em;
    color: var(--ink);
  }
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
  th, td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--rule); }
  th {
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    font-weight: 500;
  }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ok { color: var(--accent); font-family: var(--mono); font-size: 0.78rem; }
  .scores { list-style: none; padding: 0; margin: 0;
            display: grid; gap: 4px 18px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .scores li {
    display: flex; gap: 10px; align-items: baseline;
    padding: 5px 0; border-bottom: 1px solid var(--rule);
  }
  .scores .dim { flex: 1; }
  .grade {
    font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 1px 7px; border: 1px solid currentColor;
  }
  .g-strong { color: #1b7a4b; }
  .g-adequate { color: var(--accent); }
  .g-weak { color: #b4471f; }
  .g-none { color: var(--ink-faint); }
  :root:not([data-theme="light"]) .g-strong { color: #5fbf8a; }
  :root[data-theme="dark"] .g-strong { color: #5fbf8a; }
  :root:not([data-theme="light"]) .g-weak { color: #e8835c; }
  :root[data-theme="dark"] .g-weak { color: #e8835c; }
  ol.carry { margin: 0; padding-left: 20px; }
  ol.carry li { margin-bottom: 8px; }
  .verdict-line {
    font-size: 1rem; font-weight: 600; margin: 0 0 10px;
    text-wrap: balance;
  }

  @media (max-width: 560px) {
    .plate-meta, .weight, .sub { margin-left: 0; }
  }
</style>

<div class="wrap">
  <header>
    <h1>Drill Worklog 2026-10-23-2</h1>
    <p class="sub">source <b>__SRC__</b> &middot; __N_IN__ input plate(s) &middot; __N_OUT__ output plate(s)</p>
  </header>

  <section id="inputs">
    <div class="sec-head">
      <h2>Inputs</h2>
      <p class="sec-note">PDF pages rendered at 216 dpi, embedded as PNG</p>
    </div>
__IN_HTML__
  </section>

  <section id="outputs">
    <div class="sec-head">
      <h2>Outputs</h2>
      <p class="sec-note">newest first</p>
    </div>
__OUT_HTML__
  </section>
__VERDICT_HTML__
</div>

<script>
  document.querySelectorAll(".zoom").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var mount = btn.closest(".plate").querySelector(".mount");
      var on = mount.classList.toggle("actual");
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.textContent = on ? "Fit to width" : "Actual size · " + mount.dataset.w + " px";
    });
  });
</script>
