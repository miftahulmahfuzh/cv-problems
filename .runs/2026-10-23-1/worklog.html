<style>

      --paper: #14181a;
      --panel: #1b2023;
      --ink: #e6eaea;
      --ink-2: #93a0a4;
      --rule: #2e373b;
      --accent: #6fb5d6;
      --mat: #f2f3f1;

    --rule: #2e373b;

    font-size: 15px;

  }
  .wrap {

    flex-direction: column;
    gap: 28px;

  header.sheet {

    flex-wrap: wrap;

  }
  header.sheet h1 {
    margin: 0;

    font-weight: 600;
    letter-spacing: -0.01em;

  header.sheet .run {

    font-size: 12px;
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }

  h2.section {
    margin: 0 0 2px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h2.section::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  section {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .count {
    color: var(--ink-2);
    font-weight: 400;
    letter-spacing: 0.08em;
  }

  .plate {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .plate-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 18px;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .m { display: flex; gap: 6px; align-items: baseline; }
  .k { color: var(--ink-2); letter-spacing: 0.06em; }
  .v { color: var(--ink); font-weight: 500; }

  .zoom { display: flex; }
  .zoom button {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    padding: 4px 11px;
    background: var(--panel);
    color: var(--ink-2);
    border: 1px solid var(--rule);
    margin-left: -1px;
    cursor: pointer;
  }
  .zoom button:first-child { margin-left: 0; }
  .zoom button:hover { color: var(--ink); }
  .zoom button.on {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--paper);
  }
  .zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .caption {
    margin: 0;
    max-width: 68ch;
    font-size: 13.5px;
    color: var(--ink-2);
  }

  .mat {
    background: var(--mat);
    border: 1px solid var(--mat-rule);
    overflow: auto;
    line-height: 0;
  }
  .mat img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
  }
  .mat[data-fit="px"] img { width: auto; max-width: none; }

  .empty {
    margin: 0;
    padding: 22px;
    border: 1px dashed var(--rule);
    color: var(--ink-2);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    background: var(--panel);

</style>

      document.querySelectorAll('.zoom button[data-t="' + t + '"]').forEach(function (o) {
        o.classList.toggle("on", o === b);
      });
      if (b.dataset.z === "fit") {
        mat.removeAttribute("data-fit");
        img.style.width = "";
      } else {
        mat.dataset.fit = "px";
        img.style.width = img.naturalWidth * parseFloat(b.dataset.z) + "px";
      }
    });
  });
</script>
